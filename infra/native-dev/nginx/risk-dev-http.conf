# Placeholder HTTP for risk-dev. ACME only until Risk is deployed.

server {
    listen 80;
    listen [::]:80;
    server_name risk-dev.opnconsultoria.com;
    server_tokens off;

    access_log /var/log/nginx/risk-dev-access.log oracle_safe;
    error_log /var/log/nginx/risk-dev-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "risk-dev pending deployment\n";
    }
}
