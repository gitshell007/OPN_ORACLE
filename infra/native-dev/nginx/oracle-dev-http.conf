# HTTP + ACME for oracle-dev. Install before certificate issuance.
# After cert exists, use oracle-dev-https.conf for redirect + TLS.

server {
    listen 80;
    listen [::]:80;
    server_name oracle-dev.opnconsultoria.com;
    server_tokens off;

    access_log /var/log/nginx/oracle-dev-access.log oracle_safe;
    error_log /var/log/nginx/oracle-dev-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location = /internal {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    location = /health/live {
        include /etc/nginx/snippets/oracle-dev-api-proxy.conf;
    }

    location = /health/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include /etc/nginx/snippets/oracle-dev-api-proxy.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/oracle-dev-api-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/oracle-dev-web-proxy.conf;
    }

    location @oracle_web_unavailable {
        add_header Cache-Control "no-store" always;
        if ($oracle_next_rsc_prefetch = 1) {
            return 204;
        }
        return 503;
    }
}
